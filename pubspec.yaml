name: nutrilens_offline
description: Offline-first Flutter food photo nutrition and recipe analyzer powered by Qwen3-VL.
publish_to: "none"
version: 1.2.1+4

environment:
  sdk: ">=3.12.0 <4.0.0"
  flutter: ">=3.44.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  crypto: ^3.0.6
  image_picker: ^1.2.3
  image: ^4.2.0
  file_picker: ^10.3.10
  path_provider: ^2.1.6
  lib_llama_cpp: ^0.7.3
  shared_preferences: ^2.5.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
